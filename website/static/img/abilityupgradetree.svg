<svg width="100%" viewBox="0 0 680 455" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Ability upgrade tree</title>
<desc>Seven horizontal upgrade lanes. Main path has four branch points at T1 through T4. Node counts appear between milestones. All paths terminate at the same T5 capstone.</desc>
<style>
.track { stroke: #c8c6bc; stroke-width: 1; fill: none; }
.tref  { stroke: #c8c6bc; stroke-width: 0.5; stroke-dasharray: 2 4; fill: none; }
.conn  { stroke: #1D9E75; stroke-width: 0.8; stroke-dasharray: 3 2; fill: none; }
.nr    { fill: #f0eeea; stroke: #b4b2a9; stroke-width: 0.5; }
.nbp   { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 1; }
.ncap  { fill: #faeeda; stroke: #854f0b; stroke-width: 1.5; }
.tl    { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: #6b6b67; }
.tco   { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: #9b9b96; }
.leg   { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: #6b6b67; }
.divl  { stroke: #c8c6bc; stroke-width: 0.5; }
@media (prefers-color-scheme: dark) {
  .track { stroke: #3a3a38; }
  .tref  { stroke: #3a3a38; }
  .nr    { fill: #252523; stroke: #555552; }
  .nbp   { fill: #083d30; stroke: #5dcaa5; }
  .ncap  { fill: #4a2c05; stroke: #ef9f27; }
  .tl    { fill: #9b9b96; }
  .tco   { fill: #6b6b67; }
  .leg   { fill: #9b9b96; }
  .divl  { stroke: #3a3a38; }
}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Tier reference columns -->
<line class="tref" x1="222" y1="34" x2="222" y2="418"/>
<line class="tref" x1="312" y1="34" x2="312" y2="418"/>
<line class="tref" x1="402" y1="34" x2="402" y2="418"/>
<line class="tref" x1="492" y1="34" x2="492" y2="418"/>

<!-- Tier labels -->
<text class="tco" x="222" y="30" text-anchor="middle">T1</text>
<text class="tco" x="312" y="30" text-anchor="middle">T2</text>
<text class="tco" x="402" y="30" text-anchor="middle">T3</text>
<text class="tco" x="492" y="30" text-anchor="middle">T4</text>
<text class="tco" x="592" y="30" text-anchor="middle">T5 ★</text>

<!-- MAIN y=70 -->
<line class="track" x1="132" y1="70" x2="622" y2="70"/>
<text class="tl" x="128" y="74" text-anchor="end">Main</text>
<circle class="nr" cx="132" cy="70" r="5"/>
<text class="tco" x="177" y="64" text-anchor="middle">× 5</text>
<circle class="nbp" cx="222" cy="70" r="8"/>
<text class="tco" x="267" y="64" text-anchor="middle">× 5</text>
<circle class="nbp" cx="312" cy="70" r="8"/>
<text class="tco" x="357" y="64" text-anchor="middle">× 5</text>
<circle class="nbp" cx="402" cy="70" r="8"/>
<text class="tco" x="447" y="64" text-anchor="middle">× 5</text>
<circle class="nbp" cx="492" cy="70" r="8"/>
<text class="tco" x="542" y="64" text-anchor="middle">× 5</text>
<circle class="ncap" cx="592" cy="70" r="9"/>

<!-- BRANCH I y=130 -->
<line class="track" x1="222" y1="130" x2="622" y2="130"/>
<text class="tl" x="128" y="134" text-anchor="end">Branch I</text>
<circle class="nr" cx="222" cy="130" r="5"/>
<text class="tco" x="312" y="124" text-anchor="middle">× 10</text>
<circle class="nbp" cx="402" cy="130" r="8"/>
<text class="tco" x="497" y="124" text-anchor="middle">× 10</text>
<circle class="ncap" cx="592" cy="130" r="9"/>

<!-- BRANCH I-SUB y=190 -->
<line class="track" x1="402" y1="190" x2="622" y2="190"/>
<text class="tl" x="128" y="194" text-anchor="end">Branch I-Sub</text>
<circle class="nr" cx="402" cy="190" r="5"/>
<text class="tco" x="497" y="184" text-anchor="middle">× 10</text>
<circle class="ncap" cx="592" cy="190" r="9"/>

<!-- BRANCH II y=250 -->
<line class="track" x1="312" y1="250" x2="622" y2="250"/>
<text class="tl" x="128" y="254" text-anchor="end">Branch II</text>
<circle class="nr" cx="312" cy="250" r="5"/>
<text class="tco" x="402" y="244" text-anchor="middle">× 10</text>
<circle class="nbp" cx="492" cy="250" r="8"/>
<text class="tco" x="542" y="244" text-anchor="middle">× 5</text>
<circle class="ncap" cx="592" cy="250" r="9"/>

<!-- BRANCH II-SUB y=310 -->
<line class="track" x1="492" y1="310" x2="622" y2="310"/>
<text class="tl" x="128" y="314" text-anchor="end">Branch II-Sub</text>
<circle class="nr" cx="492" cy="310" r="5"/>
<text class="tco" x="542" y="304" text-anchor="middle">× 5</text>
<circle class="ncap" cx="592" cy="310" r="9"/>

<!-- BRANCH III y=360 -->
<line class="track" x1="402" y1="360" x2="622" y2="360"/>
<text class="tl" x="128" y="364" text-anchor="end">Branch III</text>
<circle class="nr" cx="402" cy="360" r="5"/>
<text class="tco" x="497" y="354" text-anchor="middle">× 10</text>
<circle class="ncap" cx="592" cy="360" r="9"/>

<!-- BRANCH IV y=410 -->
<line class="track" x1="492" y1="410" x2="622" y2="410"/>
<text class="tl" x="128" y="414" text-anchor="end">Branch IV</text>
<circle class="nr" cx="492" cy="410" r="5"/>
<text class="tco" x="542" y="404" text-anchor="middle">× 5</text>
<circle class="ncap" cx="592" cy="410" r="9"/>

<!-- Branch connectors -->
<path class="conn" d="M222,78 L222,122" marker-end="url(#arr)"/>
<path class="conn" d="M313,78 L313,242" marker-end="url(#arr)"/>
<path class="conn" d="M410,78 L410,352" marker-end="url(#arr)"/>
<path class="conn" d="M502,78 L502,402" marker-end="url(#arr)"/>
<path class="conn" d="M398,138 L398,182" marker-end="url(#arr)"/>
<path class="conn" d="M488,258 L488,302" marker-end="url(#arr)"/>

<!-- Legend -->
<line class="divl" x1="130" y1="436" x2="625" y2="436"/>
<circle class="nr"  cx="148" cy="446" r="5"/>
<text class="leg" x="158" y="450">start</text>
<circle class="nbp" cx="218" cy="446" r="8"/>
<text class="leg" x="230" y="450">branch point</text>
<circle class="ncap" cx="340" cy="446" r="9"/>
<text class="leg" x="353" y="450">capstone (T5)</text>
<line class="conn" x1="444" y1="446" x2="464" y2="446"/>
<text class="leg" x="470" y="450">branch connection</text>
</svg>
